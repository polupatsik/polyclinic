<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МедПортал — Сброс пароля</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="landing" style="background:linear-gradient(160deg,var(--navy) 0%,#112244 50%,#1a3a6e 100%);">
  <div class="landing-card">
    <div style="width:60px;height:60px;background:rgba(41,128,217,.2);border:2px solid rgba(41,128,217,.4);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;">
      <svg width="28" height="28" fill="none" stroke="white" stroke-width="1.8" viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <div class="landing-title">Новый пароль</div>
    <div class="landing-sub" style="margin-bottom:1.5rem;">Придумайте новый пароль для вашего аккаунта</div>
    <div id="alert-box"></div>
    <form id="reset-form" onsubmit="doReset(event)">
      <div class="form-group">
        <div class="input-wrap">
          <svg class="input-icon" width="15" height="15" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" class="form-control" id="new-pass" placeholder="Новый пароль" required minlength="6"
            style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:white;">
        </div>
        <div class="form-error hidden" id="pass-err" style="color:#f87171;">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
          <span>Минимум 6 символов</span>
        </div>
      </div>
      <div class="form-group">
        <div class="input-wrap">
          <svg class="input-icon" width="15" height="15" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" class="form-control" id="confirm-pass" placeholder="Подтвердите пароль" required
            style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:white;">
        </div>
        <div class="form-error hidden" id="confirm-err" style="color:#f87171;">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
          <span>Пароли не совпадают</span>
        </div>
      </div>
      <button type="submit" class="btn btn-full" id="reset-btn"
        style="background:var(--blue-mid);color:white;border-color:var(--blue-mid);padding:12px;">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Сохранить новый пароль
      </button>
    </form>
    <p style="margin-top:1.5rem;font-size:13px;">
      <a href="../index.html" style="color:rgba(255,255,255,.5);">← Вернуться ко входу</a>
    </p>
  </div>
</div>
<script src="../app.js"></script>
<script>
  const token = new URLSearchParams(window.location.search).get('token');

  if (!token) {
    document.getElementById('alert-box').innerHTML = `
      <div style="background:rgba(220,38,38,.15);color:#f87171;border:1px solid rgba(220,38,38,.3);border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-bottom:.75rem;">
        Неверная или устаревшая ссылка. Запросите восстановление пароля снова.
      </div>`;
    document.getElementById('reset-form').style.display = 'none';
  }

  async function doReset(e) {
    e.preventDefault();
    const newPass     = document.getElementById('new-pass').value;
    const confirmPass = document.getElementById('confirm-pass').value;
    const btn         = document.getElementById('reset-btn');
    const alertEl     = document.getElementById('alert-box');

    document.getElementById('pass-err').classList.add('hidden');
    document.getElementById('confirm-err').classList.add('hidden');
    alertEl.innerHTML = '';

    if (newPass.length < 6) {
      document.getElementById('pass-err').classList.remove('hidden');
      return;
    }
    if (newPass !== confirmPass) {
      document.getElementById('confirm-err').classList.remove('hidden');
      return;
    }

    setLoading(btn, true, 'Сохранение...');
    try {
      await apiFetch('/api/auth/reset-password', {
        method: 'POST',
        body: JSON.stringify({ token, new_password: newPass })
      });
      alertEl.innerHTML = `
        <div style="background:rgba(22,163,74,.15);color:#4ade80;border:1px solid rgba(22,163,74,.3);border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-bottom:.75rem;display:flex;align-items:center;gap:8px;">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          Пароль успешно изменён! Перенаправляем...
        </div>`;
      document.getElementById('reset-form').style.display = 'none';
      setTimeout(() => { window.location.href = '../index.html'; }, 2000);
    } catch(err) {
      alertEl.innerHTML = `
        <div style="background:rgba(220,38,38,.15);color:#f87171;border:1px solid rgba(220,38,38,.3);border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-bottom:.75rem;">
          ${esc(err.message)}
        </div>`;
    } finally { setLoading(btn, false); }
  }
</script>
</body>
</html>
