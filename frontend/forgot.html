<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МедПортал — Восстановление пароля</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="landing" style="background:linear-gradient(160deg,var(--navy) 0%,#112244 50%,#1a3a6e 100%);">
  <div class="landing-card">
    <div style="width:60px;height:60px;background:rgba(41,128,217,.2);border:2px solid rgba(41,128,217,.4);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;">
      <svg width="28" height="28" fill="none" stroke="white" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div class="landing-title">Забыли пароль?</div>
    <div class="landing-sub" style="margin-bottom:1.5rem;">Введите email — пришлём ссылку для восстановления</div>
    <div id="alert-box"></div>
    <form id="forgot-form" onsubmit="doForgot(event)">
      <div class="form-group">
        <div class="input-wrap">
          <svg class="input-icon" width="15" height="15" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="email" class="form-control" id="forgot-email" placeholder="your@email.ru" required
            style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:white;">
        </div>
      </div>
      <button type="submit" class="btn btn-full" id="forgot-btn"
        style="background:var(--blue-mid);color:white;border-color:var(--blue-mid);padding:12px;">
        Отправить инструкции
      </button>
    </form>
    <p style="margin-top:1.5rem;font-size:13px;">
      <a href="../index.html" style="color:rgba(255,255,255,.5);">← Вернуться ко входу</a>
    </p>
  </div>
</div>
<script src="../app.js"></script>
<script>
async function doForgot(e) {
  e.preventDefault();
  const email = document.getElementById('forgot-email').value;
  const btn = document.getElementById('forgot-btn');
  const alertEl = document.getElementById('alert-box');
  setLoading(btn, true, 'Отправка...');
  try {
    await apiFetch('/api/auth/forgot-password', { method:'POST', body: JSON.stringify({ email }) });
    alertEl.innerHTML = `<div style="background:rgba(22,163,74,.15);color:#4ade80;border:1px solid rgba(22,163,74,.3);border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-bottom:.75rem;display:flex;align-items:center;gap:8px;">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      Инструкции отправлены на ${esc(email)}</div>`;
  } catch(err) {
    alertEl.innerHTML = `<div style="background:rgba(220,38,38,.15);color:#f87171;border:1px solid rgba(220,38,38,.3);border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-bottom:.75rem;">${esc(err.message)}</div>`;
  } finally { setLoading(btn, false); }
}
</script>
</body>
</html>
