<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МедПортал — Врач</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">
        <svg width="20" height="20" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      </div>
      <div><div class="logo-name">МедПортал</div><div class="logo-tag">Кабинет врача</div></div>
    </div>
    <div class="sidebar-user" id="sidebar-user-block"></div>
    <nav class="sidebar-nav">
      <div class="nav-section">Меню</div>
      <div class="nav-item active" data-page="schedule">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Расписание
      </div>
      <div class="nav-item" data-page="list">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        Список записей
      </div>
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-ghost btn-full" onclick="logout()" style="justify-content:flex-start;gap:8px;color:rgba(255,255,255,.5);">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Выйти
      </button>
    </div>
  </aside>

  <div class="main-content">

    <!-- SCHEDULE PAGE -->
    <div id="page-schedule">
      <div class="topbar">
        <span class="topbar-title">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Расписание на неделю
        </span>
        <div class="topbar-right">
          <button class="btn btn-ghost btn-sm" onclick="shiftWeek(-1)">← Назад</button>
          <button class="btn btn-ghost btn-sm" onclick="shiftWeek(0)">Сегодня</button>
          <button class="btn btn-ghost btn-sm" onclick="shiftWeek(1)">Вперёд →</button>
        </div>
      </div>
      <div class="page-content">
        <div id="week-range" style="font-size:13px;color:var(--gray-500);margin-bottom:1rem;"></div>
        <div class="week-grid" id="week-grid">
          <div class="loading-center" style="grid-column:1/-1;"><div class="spinner"></div></div>
        </div>
        <div style="margin-top:1rem;display:flex;gap:1rem;font-size:12px;">
          <span style="display:flex;align-items:center;gap:5px;"><span style="width:12px;height:12px;border-radius:3px;background:var(--blue-light);display:inline-block;"></span> Создана</span>
          <span style="display:flex;align-items:center;gap:5px;"><span style="width:12px;height:12px;border-radius:3px;background:var(--green-light);display:inline-block;"></span> Завершена</span>
          <span style="display:flex;align-items:center;gap:5px;"><span style="width:12px;height:12px;border-radius:3px;background:var(--red-light);display:inline-block;"></span> Отменена</span>
        </div>
      </div>
    </div>

    <!-- LIST PAGE -->
    <div id="page-list" class="hidden">
      <div class="topbar">
        <span class="topbar-title">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          Все записи
        </span>
      </div>
      <div class="page-content">
        <div class="filter-bar">
          <input type="date" class="form-control" id="list-date" onchange="filterList()">
          <select class="form-control" id="list-status" onchange="filterList()">
            <option value="">Все статусы</option>
            <option value="CREATED">Создана</option>
            <option value="CONFIRMED">Подтверждена</option>
            <option value="COMPLETED">Завершена</option>
            <option value="CANCELLED">Отменена</option>
          </select>
        </div>
        <div class="card">
          <div id="list-content">
            <div class="loading-center"><div class="spinner"></div></div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- PATIENT CARD MODAL -->
<div class="modal-overlay" id="patient-modal" onclick="handleOverlayClick(event,'patient-modal')">
  <div class="modal" style="max-width:480px;">
    <button class="modal-close" onclick="closeModal('patient-modal')">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="modal-top">
      <div class="modal-icon">
        <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="modal-title">Карточка пациента</div>
      <div class="modal-sub" id="pm-appt-time"></div>
    </div>
    <div class="modal-body">
      <div id="pm-content"></div>
      <hr>
      <div class="form-group mt-2">
        <label class="form-label">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Рекомендации пациенту
        </label>
        <textarea class="form-control" id="pm-rec" placeholder="Введите назначения, рекомендации, направления..."></textarea>
      </div>
      <div id="pm-alert"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-success" onclick="finishAppt()" id="pm-finish-btn">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          Завершить приём
        </button>
        <button class="btn btn-outline" onclick="confirmAppt()" id="pm-confirm-btn">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Подтвердить
        </button>
        <button class="btn btn-danger btn-sm" onclick="cancelAppt()" id="pm-cancel-btn">
          Отменить приём
        </button>
      </div>
    </div>
  </div>
</div>

<script src="../app.js"></script>
<script>
requireRole('DOCTOR');
renderSidebarUser();

let allAppts = [];
let currentApptId = null;
let weekOffset = 0;

document.querySelectorAll('[data-page]').forEach(el => {
  el.addEventListener('click', () => showPage(el.dataset.page));
});

function showPage(id) {
  ['schedule','list'].forEach(p => {
    document.getElementById('page-'+p).classList.toggle('hidden', p !== id);
  });
  document.querySelectorAll('[data-page]').forEach(e =>
    e.classList.toggle('active', e.dataset.page === id));
  if (id === 'list') filterList();
}

function handleOverlayClick(e, id) { if (e.target.id === id) closeModal(id); }

async function loadAll() {
  allAppts = await Appointments.doctor().catch(() => []);
  renderWeek();
  filterList();
}

// ── WEEK SCHEDULE ──
function shiftWeek(dir) {
  if (dir === 0) weekOffset = 0; else weekOffset += dir;
  renderWeek();
}

function renderWeek() {
  const now = new Date();
  const startOfWeek = new Date(now);
  startOfWeek.setDate(now.getDate() - now.getDay() + 1 + weekOffset * 7);

  const days = Array.from({length:7}, (_,i) => {
    const d = new Date(startOfWeek);
    d.setDate(startOfWeek.getDate() + i);
    return d;
  });

  const rangeEl = document.getElementById('week-range');
  rangeEl.textContent = `${days[0].toLocaleDateString('ru',{day:'2-digit',month:'long'})} — ${days[6].toLocaleDateString('ru',{day:'2-digit',month:'long',year:'numeric'})}`;

  const dayNames = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const todayStr = new Date().toDateString();
  const grid = document.getElementById('week-grid');

  grid.innerHTML = days.map((d, i) => {
    const dateStr = d.toISOString().split('T')[0];
    const isToday = d.toDateString() === todayStr;
    const dayAppts = allAppts.filter(a => a.start_time.startsWith(dateStr));

    const apptHtml = dayAppts
      .sort((a,b) => new Date(a.start_time)-new Date(b.start_time))
      .map(a => {
        const cls = a.status_name === 'COMPLETED' ? 'done' : a.status_name === 'CANCELLED' ? 'cancelled' : '';
        return `<div class="week-appt ${cls}" onclick="openPatientModal(${a.id})" title="Пациент #${a.patient_id}">
          ${fmtTime(a.start_time)} #${a.patient_id}
        </div>`;
      }).join('');

    return `<div class="week-day ${isToday?'today':''}">
      <div class="week-day-head">
        <span class="dn">${d.getDate()}</span>${dayNames[i]}
      </div>
      ${apptHtml || ''}
    </div>`;
  }).join('');
}

// ── LIST ──
function filterList() {
  const dateVal = document.getElementById('list-date').value;
  const statusVal = document.getElementById('list-status').value;
  let list = [...allAppts];
  if (dateVal) list = list.filter(a => a.start_time.startsWith(dateVal));
  if (statusVal) list = list.filter(a => a.status_name === statusVal);
  list.sort((a,b) => new Date(a.start_time)-new Date(b.start_time));
  renderList(list);
}

function renderList(list) {
  const el = document.getElementById('list-content');
  if (!list.length) {
    el.innerHTML = `<div class="empty-state">
      <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <h3>Нет записей</h3><p>Измените фильтр</p></div>`;
    return;
  }
  el.innerHTML = list.map(a => {
    const d = new Date(a.start_time);
    return `<div class="appt-item" style="cursor:pointer;" onclick="openPatientModal(${a.id})">
      <div class="appt-date-box">
        <div class="day">${d.getDate()}</div>
        <div class="mon">${d.toLocaleString('ru',{month:'short'})}</div>
      </div>
      <div class="appt-info">
        <div class="appt-title">Пациент #${a.patient_id}</div>
        <div class="appt-time">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          ${d.toLocaleString('ru',{weekday:'short',hour:'2-digit',minute:'2-digit'})}
        </div>
        ${a.complaints ? `<div class="appt-note">${esc(a.complaints)}</div>` : ''}
        <div style="margin-top:5px;">${statusBadge(a.status_name||'CREATED')}</div>
      </div>
      <div class="appt-actions">
        <button class="btn btn-outline btn-sm">Открыть</button>
      </div>
    </div>`;
  }).join('');
}

// ── PATIENT MODAL ──
function openPatientModal(id) {
  const a = allAppts.find(x => x.id === id); if (!a) return;
  currentApptId = id;
  const d = new Date(a.start_time);
  document.getElementById('pm-appt-time').textContent = `${d.toLocaleString('ru',{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}`;
  document.getElementById('pm-rec').value = '';
  document.getElementById('pm-alert').innerHTML = '';

  const isDone = a.status_name === 'COMPLETED';
  const isCancelled = a.status_name === 'CANCELLED';
  document.getElementById('pm-finish-btn').disabled = isDone || isCancelled;
  document.getElementById('pm-confirm-btn').disabled = a.status_name === 'CONFIRMED' || isDone || isCancelled;
  document.getElementById('pm-cancel-btn').disabled = isCancelled || isDone;

  document.getElementById('pm-content').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div style="display:flex;gap:10px;align-items:flex-start;">
        <svg width="16" height="16" fill="none" stroke="var(--blue-mid)" stroke-width="2" viewBox="0 0 24 24" style="margin-top:2px;flex-shrink:0;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <div><div style="font-size:12px;color:var(--gray-500);">Пациент</div><div style="font-weight:600;">#${a.patient_id}</div></div>
      </div>
      <div style="display:flex;gap:10px;align-items:flex-start;">
        <svg width="16" height="16" fill="none" stroke="var(--blue-mid)" stroke-width="2" viewBox="0 0 24 24" style="margin-top:2px;flex-shrink:0;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <div><div style="font-size:12px;color:var(--gray-500);">Время приёма</div><div style="font-weight:600;">${d.toLocaleString('ru',{hour:'2-digit',minute:'2-digit'})}</div></div>
      </div>
      ${a.complaints ? `<div style="display:flex;gap:10px;align-items:flex-start;">
        <svg width="16" height="16" fill="none" stroke="var(--blue-mid)" stroke-width="2" viewBox="0 0 24 24" style="margin-top:2px;flex-shrink:0;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <div><div style="font-size:12px;color:var(--gray-500);">Жалобы</div><div style="font-size:14px;">${esc(a.complaints)}</div></div>
      </div>` : ''}
      <div style="display:flex;gap:10px;align-items:center;">
        <svg width="16" height="16" fill="none" stroke="var(--blue-mid)" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0;"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <div><div style="font-size:12px;color:var(--gray-500);">Статус</div>${statusBadge(a.status_name||'CREATED')}</div>
      </div>
    </div>`;
  openModal('patient-modal');
}

async function updateStatus(status) {
  const btn = status === 'COMPLETED' ? document.getElementById('pm-finish-btn') :
              status === 'CONFIRMED' ? document.getElementById('pm-confirm-btn') :
              document.getElementById('pm-cancel-btn');
  setLoading(btn, true, '');
  try {
    await Appointments.status(currentApptId, status);
    const appt = allAppts.find(a => a.id === currentApptId);
    if (appt) appt.status_name = status;
    closeModal('patient-modal');
    toast(status === 'COMPLETED' ? 'Приём завершён' : status === 'CONFIRMED' ? 'Запись подтверждена' : 'Приём отменён', 'success');
    renderWeek(); filterList();
  } catch(e) {
    document.getElementById('pm-alert').innerHTML = `<div style="color:var(--red);font-size:13px;margin-bottom:.5rem;">${esc(e.message)}</div>`;
  } finally { setLoading(btn, false); }
}

function finishAppt()  { updateStatus('COMPLETED'); }
function confirmAppt() { updateStatus('CONFIRMED'); }
function cancelAppt()  { updateStatus('CANCELLED'); }

loadAll();
</script>
</body>
</html>
